name: analisis-xrp
on:
  workflow_dispatch:            # botón "Run workflow" (solo aparece cuando este archivo está en main)
    inputs:
      horizonte:
        description: "Horizonte en días"
        type: choice
        options: ["24h", "7", "14", "30"]
        default: "24h"
  schedule:
    - cron: "17 6 * * *"        # cada día a las 06:17 UTC (solo funciona desde main)
permissions:
  contents: write
env:
  HORIZONTE: ${{ inputs.horizonte || '24h' }}
jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r analysis/requirements.txt
      - name: Descargar datos
        run: python analysis/fetch_data.py
      - name: Backtest
        run: |
          if [ "$HORIZONTE" = "24h" ]; then python analysis/xrp_24h.py --backtest
          else python analysis/backtest_v1_vs_v2.py; fi
      - name: Cono y escenarios
        run: |
          if [ "$HORIZONTE" = "24h" ]; then python analysis/xrp_24h.py
          else python analysis/xrp_scenarios_v2.py; fi
      - name: Resumen en la página del run
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          r = json.load(open("analysis/output/resultados_v2.json"))
          HT = r.get("horizonte_texto", f"{r['horizonte_dias']} días")
          dec = 4 if r.get("paso") == "hora" else 3
          print(f"## XRP — escenarios a {HT} (precio {r['precio']:.4f} $ a las {r['precio_hora_utc']} UTC)\n")
          print(f"| Percentil al final ({r['cono']['etiquetas'][-1]}) | Precio |\n|---|---|")
          for k in ("P5", "P25", "P50", "P75", "P95"):
              print(f"| {k} | {r['cono'][k][-1]:.{dec}f} $ |")
          print("\n| Escenario | Probabilidad | Rango |\n|---|---|---|")
          for k, v in r["escenarios"].items():
              lo, hi = v["rango"]
              rng = f"< {hi:.{dec}f}" if lo is None else (f"> {lo:.{dec}f}" if hi is None else f"{lo:.{dec}f}–{hi:.{dec}f}")
              print(f"| {k} | {v['prob_pct']:.0f} % | {rng} $ |")
          print("\n*Estimación probabilística, no una predicción.* El gráfico está en el artefacto **graficos-xrp** de este run.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: graficos-xrp
          path: analysis/output/
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/data analysis/output
          if git commit -m "Análisis XRP actualizado ($(date -u +%F))"; then
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Preparar la página web
        run: |
          mkdir -p _site
          cp analysis/web/index.html _site/
          cp analysis/output/resultados_v2.json analysis/output/backtest_v1_vs_v2.json _site/
          cp analysis/output/xrp_escenarios_v2.png analysis/output/xrp_calibracion_v1_vs_v2.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publica la página en GitHub Pages (requiere Settings → Pages → Source: GitHub Actions)
  web:
    needs: analisis
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
